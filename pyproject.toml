[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "worldlab"
version = "0.3.4"
description = "Framework-neutral reinforcement-learning environments powered by world models"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "WorldLab contributors" },
]
dependencies = [
    "numpy>=1.24",
    "omegaconf>=2.3,<3",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "mypy>=1.11,<1.12",
    "pytest>=8.0",
    "twine>=5.1",
]
ui = [
    "worldlab-ui-panel>=0.3.4,<0.4",
]
transport = [
    "worldlab-transport>=0.3.4,<0.4",
]
openpi = [
    "worldlab-integrations-openpi>=0.3.4,<0.4",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["worldlab*"]
namespaces = false

[tool.setuptools.package-data]
worldlab = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = [
    "src",
    "packages/worldlab-transport/src",
]
testpaths = [
    "tests",
    "packages/worldlab-transport/tests",
    "packages/worldlab-ui-panel/tests",
    "packages/worldlab-integrations-openpi/tests",
]

[tool.mypy]
python_version = "3.10"
files = ["src/worldlab", "tests"]
strict = true
