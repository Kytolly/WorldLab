name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.12"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install -e packages/worldlab-ui-panel -e packages/worldlab-integrations-openpi

      - name: Run unit tests
        run: python -m pytest -q

      - name: Run deterministic release acceptance
        run: python -m worldlab --acceptance --goal 3 --seed 0

      - name: Run strict type checks
        run: python -m mypy --config-file pyproject.toml

      - name: Compile Python sources
        run: python -m compileall -q src tests packages/worldlab-ui-panel/src packages/worldlab-integrations-openpi/src

  package:
    name: Build distributions
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build tools
        run: python -m pip install --upgrade pip && python -m pip install ".[dev]"

      - name: Build all wheel and source distributions
        run: |
          python -m build
          python -m build packages/worldlab-ui-panel --outdir dist
          python -m build packages/worldlab-integrations-openpi --outdir dist

      - name: Validate distribution metadata
        run: python -m twine check dist/*

      - name: Test wheel installation
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python -c "import worldlab; print(worldlab.__file__)"

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: worldlab-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 14
