[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "worldlab-integrations-openpi"
version = "0.3.4"
description = "OpenPI policy integration for WorldLab"
requires-python = ">=3.10"
dependencies = [
    "worldlab>=0.3.4,<0.4",
    "numpy>=1.24",
    "openpi-client>=0.1",
    "websockets>=14,<16",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["worldlab_openpi*"]
namespaces = false

[tool.setuptools.package-data]
worldlab_openpi = ["py.typed"]
