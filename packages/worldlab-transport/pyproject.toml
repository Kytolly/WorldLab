[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "worldlab-transport"
version = "0.3.4"
description = "Domain-neutral synchronous transport contracts for WorldLab services"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["worldlab_transport*"]
namespaces = false

[tool.setuptools.package-data]
worldlab_transport = ["py.typed"]
